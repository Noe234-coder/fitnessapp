name: CI

on:
  push:
  pull_request:

# The default token can only read the repository. No job needs more.
permissions:
  contents: read

jobs:
  app:
    name: App checks and build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run format:check
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test
      # Repository variables are not passed to pull requests from forks, where
      # the build still works but must never be deployed. On a push they are
      # required: an empty value would ship an app that cannot start.
      - name: Check the build variables are set
        if: github.event_name == 'push'
        env:
          VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ vars.VITE_SUPABASE_PUBLISHABLE_KEY }}
        run: |
          for name in VITE_SUPABASE_URL VITE_SUPABASE_PUBLISHABLE_KEY; do
            if [ -z "${!name}" ]; then
              echo "::error::Repository variable $name is not set."
              exit 1
            fi
          done
      - run: npm run build
        env:
          VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ vars.VITE_SUPABASE_PUBLISHABLE_KEY }}
      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist
          if-no-files-found: error
          retention-days: 7

  db:
    name: Database tests and types
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run db:network
      # Only Postgres is needed: the pgTAP tests and the type generation talk
      # to the database directly, so every other service is left out.
      - run: npm run db:start -- --exclude gotrue,realtime,storage-api,imgproxy,kong,mailpit,postgrest,postgres-meta,studio,edge-runtime,logflare,vector,supavisor
      - run: npm run db:reset
      - run: npm run db:test
      - run: npm run db:types
      - name: Check the generated types are committed
        run: git diff --exit-code src/lib/database.types.ts

  deploy:
    name: Deploy to Cloudflare
    needs: [app, db]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: production
    # One deploy at a time: a newer run waits for the one in progress.
    concurrency: deploy-production
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      # Deploy exactly what the `app` job built and checked: no rebuild.
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist
      - run: npx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
